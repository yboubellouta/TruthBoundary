name: truthboundary
description: TruthBoundary - Spreading Dawah

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  # Media picking
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  # Media playback
  video_player: ^2.9.1
  audioplayers: ^6.0.0
  # UI & utils
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
